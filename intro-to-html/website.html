<!DOCTYPE html>
<html>
  <head>
    <title>First Website</title>
  </head>
  <body><!--sintaxe HTML-->

<!--a sintaxe sao as regra que definem a estrutura dos elementos HTML (< >)-->
<button>
  hello
</button>

<p>
  paragraph of text
</p>

<!--ancora de links se refera ao (A) fazendo a coxenexao com o href-->

<a 
  href="https://www.youtube.com/">ancora de site
</a>    <!--atributos (href)-->

<!--IMPORTANTE! aspas duplas ("") = valor do atributo (href) -->

<a href="https://www.youtube.com/"target="_blank">
  ancora 2, em outra aba
</a>
<!-- a alteraçao de aba esta relacionada ao atributo (target + _blanck)--></body>
</html>
